name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  changes:
    name: Resolve affected projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.affected.outputs.projects }}
      has-projects: ${{ steps.affected.outputs.has-projects }}
      aot: ${{ steps.affected.outputs.aot }}
      packages: ${{ steps.affected.outputs.packages }}
      tooling: ${{ steps.affected.outputs.tooling }}
      tooling-projects: ${{ steps.affected.outputs.tooling-projects }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: affected
        name: Compute reverse dependency closure
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          elif [[ -n "${EVENT_BEFORE:-}" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            base="$EVENT_BEFORE"
          else
            base=$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          fi

          chmod +x eng/tools/linux-x64/mt-affected
          git diff --name-only --diff-filter=ACMRTUXB -z "$base" HEAD | \
            eng/tools/linux-x64/mt-affected --stdin-z \
              --ci-output "$GITHUB_OUTPUT"

  tooling:
    name: Native tooling (${{ matrix.tool }}, ${{ matrix.rid }})
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        tool: ${{ fromJSON(needs.changes.outputs.tooling-projects) }}
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.3xx
      - name: Compile NativeAOT tools from source
        shell: bash
        run: |
          project=eng/${{ matrix.tool }}/${{ matrix.tool }}.csproj
          dotnet restore "$project" -r ${{ matrix.rid }}
          dotnet publish "$project" -c Release -r ${{ matrix.rid }} \
            --no-restore -o artifacts/tooling/${{ matrix.rid }}

  pull-request:
    name: Pull request validation
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.3xx
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Verify portable shipping lock files
        run: eng/tools/linux-x64/mt-verify-locks
      - name: Restore and audit locked dependencies
        run: dotnet restore MonadicTypes.slnx --locked-mode
      - name: Verify formatting
        run: dotnet format whitespace MonadicTypes.slnx --verify-no-changes --no-restore
      - name: Build and test affected projects
        if: needs.changes.outputs.has-projects == 'true'
        env:
          AFFECTED_PROJECTS: ${{ needs.changes.outputs.projects }}
        run: |
          mkdir -p artifacts/ci
          dotnet new sln --name Affected --format slnx --output artifacts/ci
          IFS=';' read -ra projects <<< "$AFFECTED_PROJECTS"
          dotnet sln artifacts/ci/Affected.slnx add "${projects[@]}"
          dotnet build artifacts/ci/Affected.slnx -c Release --no-restore
          dotnet test artifacts/ci/Affected.slnx -c Release --no-build --no-restore

  master-quality:
    name: Master build and test (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.3xx
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Verify portable shipping lock files
        run: |
          case "${{ runner.os }}" in
            Linux) eng/tools/linux-x64/mt-verify-locks ;;
            Windows) eng/tools/win-x64/mt-verify-locks.exe ;;
          esac
      - name: Restore and audit locked dependencies
        run: dotnet restore MonadicTypes.slnx --locked-mode
      - name: Report vulnerable dependencies
        run: |
          while IFS= read -r project; do
            dotnet package list --project "$project" --vulnerable --include-transitive --no-restore
          done < <(find src tests benchmarks \
            -type d \( -name bin -o -name obj -o -name artifacts \) -prune -o \
            -name '*.csproj' -type f \
            ! -path 'tests/MonadicTypes.AotSmoke/*' \
            ! -path 'tests/MonadicTypes.PackageSmoke/*' -print | sort)
      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format whitespace MonadicTypes.slnx --verify-no-changes --no-restore
      - name: Build affected projects
        if: needs.changes.outputs.has-projects == 'true'
        env:
          AFFECTED_PROJECTS: ${{ needs.changes.outputs.projects }}
        run: |
          mkdir -p artifacts/ci
          dotnet new sln --name Affected --format slnx --output artifacts/ci
          IFS=';' read -ra projects <<< "$AFFECTED_PROJECTS"
          dotnet sln artifacts/ci/Affected.slnx add "${projects[@]}"
          dotnet build artifacts/ci/Affected.slnx -c Release --no-restore
          dotnet test artifacts/ci/Affected.slnx -c Release --no-build --no-restore

  native-aot:
    name: NativeAOT (${{ matrix.rid }})
    needs: [changes, master-quality]
    if: github.event_name != 'pull_request' && needs.changes.outputs.aot == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.3xx
      - name: Restore audited NativeAOT toolchain
        run: |
          for project in tests/*AotSmoke/*.csproj; do
            dotnet restore "$project" -r ${{ matrix.rid }} --force-evaluate \
              -p:RestorePackagesWithLockFile=false \
              -p:RestoreLockedMode=false \
              -p:NuGetLockFilePath="$RUNNER_TEMP/monadic-types-${{ matrix.rid }}.lock.json"
          done
      - name: Publish NativeAOT smoke executables
        run: |
          for project in tests/*AotSmoke/*.csproj; do
            name=$(basename "$project" .csproj)
            output="artifacts/aot/${{ matrix.rid }}/$name"
            dotnet publish "$project" -c Release -r ${{ matrix.rid }} --no-restore -o "$output"
            executable="$output/$name"
            [[ "${{ matrix.rid }}" == win-* ]] && executable+=.exe
            "$executable"
          done

  packages:
    name: Pack and consume NuGet artifacts
    needs: [changes, pull-request]
    if: github.event_name == 'pull_request' && needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.3xx
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Verify portable shipping lock files
        run: eng/tools/linux-x64/mt-verify-locks
      - name: Restore locked dependencies
        run: dotnet restore MonadicTypes.slnx --locked-mode
      - name: Build and verify packages
        run: eng/tools/linux-x64/mt-pack 0.1.0-ci.${{ github.run_number }}
      - name: Consume packages under NativeAOT
        run: eng/tools/linux-x64/mt-test-packages 0.1.0-ci.${{ github.run_number }} linux-x64
      - uses: actions/upload-artifact@v5
        with:
          name: packages-${{ github.sha }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        with:
          config-file: ./.github/dependency-review-config.yml
