name: CodeQL

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.3xx
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended
      - name: Restore locked dependencies
        run: dotnet restore MonadicTypes.slnx --locked-mode
      - name: Build
        run: dotnet build MonadicTypes.slnx -c Release --no-restore
      - uses: github/codeql-action/analyze@v4
